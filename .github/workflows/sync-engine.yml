name: Sync Engine from game-engine

on:
  repository_dispatch:
    types: [engine-updated]

permissions:
  contents: write

jobs:
  sync-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out spare-parts
        uses: actions/checkout@v4

      - name: Check out game-engine
        uses: actions/checkout@v4
        with:
          repository: FSChuang/game-engine
          path: _game-engine-source

      - name: Replace Engine/ with the authoritative mirror (Game/ is never touched)
        run: |
          rsync -a --delete _game-engine-source/Engine/ Engine/

      - name: Remove the temporary game-engine checkout
        run: rm -rf _game-engine-source

      - name: Set up SDL3
        uses: libsdl-org/setup-sdl@main
        with:
          install-linux-dependencies: true
          version: 3-latest

      # Milestone 2 Section 2: the real client (main) and headless server (server)
      # both need libzmq + cppzmq to build.
      - name: Set up ZeroMQ
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev cppzmq-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Commit and push Engine/ if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Engine
          if git diff --cached --quiet; then
            echo "Engine/ is already up to date; nothing to sync."
            exit 0
          fi
          git commit -m "Sync Engine/ from FSChuang/game-engine"
          git push
