name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up SDL3
        uses: libsdl-org/setup-sdl@main
        with:
          install-linux-dependencies: true
          version: 3-latest

      # Milestone 2 Section 2: the real client (main) and headless server (server)
      # both need libzmq + cppzmq to build. libzmq3-dev provides libzmq (and a
      # pkg-config file cppzmq's own CMake config falls back to); cppzmq-dev
      # provides zmq.hpp and cppzmq's CMake config.
      - name: Set up ZeroMQ
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev cppzmq-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build
